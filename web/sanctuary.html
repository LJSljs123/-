<!DOCTYPE html>

<style>
:root {
  color-scheme: dark;
  --accent: #95604d;
  --accent-light: #d2a081;
  --accent-deep: #4d3931;
  --gold: #d6c49a;
  --paper: #eeeae0;
  --muted: #b5bdb9;
  --ink: #101619;
  --panel: rgba(17, 23, 25, .84);
  --line: rgba(214, 196, 154, .24);
  font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 58%, #273236 0%, #161e22 48%, #0a0e11 100%);
  color: var(--paper);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button, a { font: inherit; }
button { color: inherit; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--accent-light); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#world { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; touch-action: none; }
#hud, #tools, #ctrl, #stat, #tip, #panel, #cap, #loading, #fallback { position: fixed; z-index: 2; }
#hud {
  inset: 0 0 auto; display: grid; grid-template-columns: minmax(260px, 1fr) auto;
  align-items: start; gap: 20px; padding: 22px clamp(18px, 3vw, 48px) 28px;
  background: linear-gradient(180deg, rgba(13, 18, 20, .95), rgba(13, 18, 20, .58) 68%, transparent);
  pointer-events: none;
}
.identity { display: flex; align-items: center; gap: 14px; min-width: 0; }
.seal {
  display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px;
  border: 1px solid var(--accent-light); color: var(--accent-light); transform: rotate(45deg);
  box-shadow: 0 0 22px rgba(210, 160, 129, .12); font: 700 17px/1 "STSong", serif;
}
.seal span { transform: rotate(-45deg); }
.eyebrow { color: var(--accent-light); font: 10px/1.4 ui-monospace, Consolas, monospace; letter-spacing: .22em; }
h1 { margin: 3px 0 0; color: var(--paper); font-size: clamp(20px, 2vw, 27px); font-weight: 500; letter-spacing: .28em; }
.subtitle { margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.nav { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 9px 18px; padding-top: 4px; pointer-events: auto; }
.nav a { color: #e8d7c6; font-size: 12px; border-bottom: 1px solid rgba(228, 189, 120, .28); padding-bottom: 4px; }
.nav a:first-child { color: var(--gold); }
#tools { top: 112px; right: clamp(18px, 3vw, 48px); display: flex; align-items: flex-end; flex-direction: column; gap: 7px; max-width: 340px; }
.vr-button, .tool-button, #ctrl button, #panel button {
  border: 1px solid var(--line); border-radius: 2px; background: rgba(19, 26, 28, .82);
  color: var(--paper); cursor: pointer; transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
}
.vr-button { padding: 10px 16px; border-color: rgba(214, 196, 154, .56); color: #f1ead9; background: linear-gradient(135deg, rgba(69, 74, 66, .88), rgba(25, 32, 34, .94)); box-shadow: 0 0 28px rgba(20, 28, 30, .28); font-size: 12px; letter-spacing: .12em; }
.vr-button:not(:disabled):hover, #ctrl button:hover, #panel button:hover { border-color: var(--gold); background-color: rgba(80, 88, 76, .58); transform: translateY(-1px); }
.vr-button:disabled { color: #a9948a; border-color: rgba(228, 189, 120, .18); cursor: help; }
.gyro-button { display: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px; background: rgba(19, 26, 28, .9); color: var(--paper); font-size: 10px; }
#vr-hint { color: #d8c5b7; font: 10px/1.6 ui-monospace, Consolas, monospace; text-align: right; text-shadow: 0 1px 8px #080609; }
.brief { position: fixed; z-index: 1; left: clamp(18px, 3vw, 48px); bottom: 112px; width: min(340px, 30vw); pointer-events: none; }
.brief::before { content: ""; display: block; width: 36px; height: 2px; margin-bottom: 12px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.brief .tag { color: var(--gold); font: 10px/1.5 ui-monospace, Consolas, monospace; letter-spacing: .18em; }
.brief h2 { max-width: 280px; margin: 8px 0 6px; font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; line-height: 1.45; letter-spacing: .08em; text-shadow: 0 3px 24px #090509; }
.brief p { max-width: 320px; margin: 0; color: #d4c3b9; font-size: 12px; line-height: 1.9; text-shadow: 0 2px 10px #090509; }
#stat { left: 50%; bottom: 76px; width: min(90vw, 880px); transform: translateX(-50%); color: #e0cbb9; font: 10px/1.6 ui-monospace, Consolas, monospace; letter-spacing: .1em; text-align: center; text-shadow: 0 2px 12px #090509; pointer-events: none; }
#ctrl { left: 50%; bottom: max(17px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; width: max-content; max-width: calc(100vw - 24px); transform: translateX(-50%); padding: 7px; border: 1px solid rgba(214, 196, 154, .2); background: rgba(13, 18, 20, .74); backdrop-filter: blur(16px); }
#ctrl button { min-height: 39px; padding: 8px 15px; white-space: nowrap; font-size: 11px; letter-spacing: .06em; }
#ctrl button.primary { border-color: rgba(214, 196, 154, .7); color: #f3ead3; background: rgba(68, 74, 62, .66); }
#ctrl button.on { border-color: var(--gold); color: #fff6e4; background: rgba(83, 88, 69, .84); }
#ctrl button:disabled { opacity: .55; cursor: progress; }
#tip { display: none; width: min(370px, calc(100vw - 28px)); max-height: min(58vh, 520px); overflow: auto; padding: 14px 16px; border: 1px solid rgba(214, 196, 154, .44); background: rgba(16, 22, 24, .97); box-shadow: 0 18px 60px rgba(0, 0, 0, .6), 0 0 34px rgba(53, 67, 62, .18); color: var(--paper); font-size: 12px; line-height: 1.8; pointer-events: none; }
#tip.on { display: block; }
#tip .t { margin-bottom: 6px; color: var(--gold); font: 10px/1.5 ui-monospace, Consolas, monospace; letter-spacing: .12em; }
#tip .q { margin-top: 8px; padding-left: 10px; border-left: 2px solid rgba(228, 189, 120, .5); color: #e2d4ca; font-size: 11px; }
#tip .pv { margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(228, 189, 120, .18); color: #c1aca0; font-size: 10px; overflow-wrap: anywhere; }
#tip .pv a { color: var(--gold); border-bottom: 1px dotted currentColor; }
#tip .w { margin-top: 6px; color: var(--accent-light); font-size: 11px; }
#tip .dv { margin-top: 7px; padding: 6px 9px; border-left: 2px solid var(--accent); background: rgba(119, 96, 69, .16); font-size: 11px; }
#tip .dv b { margin-right: 6px; color: var(--accent-light); letter-spacing: .12em; }
#panel { inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(8, 12, 14, .76); backdrop-filter: blur(7px); }
#panel.on { display: flex; }
#panel .card { width: min(560px, 100%); max-height: min(86vh, 680px); overflow: auto; padding: clamp(22px, 4vw, 42px); border: 1px solid rgba(214, 196, 154, .5); background: linear-gradient(155deg, rgba(39, 47, 44, .99), rgba(15, 21, 23, .99) 62%); box-shadow: 0 26px 100px rgba(0,0,0,.68), 0 0 50px rgba(67,83,74,.14); }
#panel .h { color: var(--gold); font: 11px/1.6 ui-monospace, Consolas, monospace; letter-spacing: .22em; }
#panel .big { margin: 13px 0 16px; color: var(--paper); font-size: clamp(19px, 4vw, 28px); line-height: 1.5; }
#panel .big b { color: var(--accent-light); font: 600 1.15em ui-monospace, Consolas, monospace; }
#panel .lines { margin: 0 0 20px; color: #d7c7bc; font-size: 12px; line-height: 2; }
#panel .lines em { color: var(--gold); font-style: normal; }
#panel button { padding: 10px 16px; border-color: rgba(214, 196, 154, .48); font-size: 11px; }
#cap { left: 50%; bottom: 126px; width: min(760px, calc(100vw - 32px)); max-height: min(36vh, 280px); overflow: auto; transform: translateX(-50%); padding: 15px 19px 13px; border: 1px solid rgba(214, 196, 154, .28); background: linear-gradient(110deg, rgba(29, 37, 37, .96), rgba(14, 20, 22, .94)); box-shadow: 0 14px 56px rgba(0,0,0,.38), inset 3px 0 0 rgba(149, 96, 77, .72); backdrop-filter: blur(14px); color: #f3efe5; line-height: 1.75; letter-spacing: .035em; opacity: 0; visibility: hidden; transition: opacity .45s ease; pointer-events: none; }
#cap.on { opacity: .98; visibility: visible; pointer-events: auto; }
#cap-step { color: var(--gold); font: 9px/1.5 ui-monospace, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
#cap h2 { margin: 3px 0 4px; color: #fff1e5; font-size: clamp(16px, 1.65vw, 21px); font-weight: 500; letter-spacing: .09em; }
#cap p { margin: 0; font-size: clamp(12px, 1.15vw, 14px); line-height: 1.8; text-shadow: 0 2px 15px #090509; }
#cap .s { display: block; margin-top: 6px; color: #d8c5b7; font-size: 10px; letter-spacing: .025em; }
#cap-progress { display: grid; grid-template-columns: repeat(8, minmax(10px, 1fr)); gap: 5px; margin-top: 12px; }
#cap-progress[hidden], #cap-nav[hidden] { display: none; }
#cap-progress button { position: relative; height: 26px; min-height: 26px; padding: 0; border: 0; background: transparent; cursor: pointer; }
#cap-progress button::before { content: ""; position: absolute; inset: 11px 0; border-radius: 2px; background: linear-gradient(90deg, rgba(210, 160, 129, .92) var(--fill, 0%), rgba(214, 196, 154, .17) var(--fill, 0%)); }
#cap-progress button.current::before { box-shadow: 0 0 12px rgba(210, 160, 129, .42); }
#cap-progress button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#cap-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 7px; color: #cbb5a8; font: 9px/1.5 ui-monospace, Consolas, monospace; }
#cap-nav button { min-height: 25px; padding: 3px 9px; border: 1px solid rgba(228, 189, 120, .2); background: rgba(71, 16, 23, .46); color: #f1ddd0; cursor: pointer; }
#cap-nav button:disabled { opacity: .4; cursor: default; }
body.story-active .brief, body.story-active #tools, body.factory-active .brief { opacity: 0; visibility: hidden; }
body.factory-active #cap { top: 210px; right: 24px; bottom: auto; left: auto; width: min(410px, 32vw); max-height: min(52vh, 410px); transform: none; }
#loading { inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 13px; background: radial-gradient(ellipse at center, #303b39, #151d20 58%, #0a0e11); transition: opacity .7s ease; }
#loading.off { opacity: 0; pointer-events: none; }
#loading .mark { width: 34px; height: 34px; border: 1px solid var(--accent-light); transform: rotate(45deg); animation: pulse 1.8s ease-in-out infinite; }
#loading .t { color: #fff0e6; font-size: 13px; letter-spacing: .42em; }
#loading .s { color: #c7a999; font: 10px/1.6 ui-monospace, Consolas, monospace; letter-spacing: .12em; }
#fallback { inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: #101619; text-align: center; }
#fallback.on { display: flex; }
#fallback .card { max-width: 480px; padding: 32px; border: 1px solid var(--line); background: #202a2c; }
#fallback h2 { color: var(--accent-light); font-weight: 500; }
#fallback p { color: #dfcec2; font-size: 13px; line-height: 1.9; }
#fallback a { display: inline-block; margin-top: 8px; padding: 9px 15px; border: 1px solid var(--line); }
.skip { position: fixed; z-index: 30; top: 8px; left: 8px; padding: 8px 12px; transform: translateY(-160%); background: #200c11; color: white; }
.skip:focus { transform: none; }
@keyframes pulse { 50% { box-shadow: 0 0 28px rgba(214, 196, 154, .38); } }
@media (max-width: 760px) {
  #hud { grid-template-columns: 1fr; gap: 9px; padding: 14px 16px 30px; }
  .seal { width: 30px; height: 30px; flex-basis: 30px; font-size: 14px; }
  .subtitle { max-width: 72vw; font-size: 9px; line-height: 1.6; }
  .nav { position: absolute; top: 17px; right: 16px; gap: 8px; max-width: 42vw; }
  .nav a { font-size: 10px; }
  #tools { top: auto; right: 14px; bottom: 110px; max-width: 55vw; }
  .gyro-button { display: block; }
  #vr-hint { max-width: 240px; font-size: 9px; }
  .vr-button { padding: 9px 12px; font-size: 10px; }
  .brief { left: 16px; bottom: 116px; width: min(58vw, 290px); }
  .brief h2 { font-size: 19px; }
  .brief p { font-size: 10px; line-height: 1.7; }
  #stat { bottom: 67px; font-size: 9px; letter-spacing: .02em; }
  #stat::after { content: " · 单指环视 / 双指缩放"; color: #f0b0a1; }
  #ctrl { bottom: max(10px, env(safe-area-inset-bottom)); flex-wrap: wrap; gap: 5px; width: calc(100vw - 18px); padding: 5px; }
  #ctrl button { min-height: 36px; flex: 1 1 auto; padding: 7px 9px; font-size: 10px; }
  #cap { bottom: 133px; max-height: min(34vh, 270px); padding: 13px 15px 11px; }
  body.factory-active #cap { top: 82px; right: 10px; bottom: auto; left: 10px; width: auto; max-height: min(31vh, 250px); }
  #cap p { font-size: 12px; }
}
@media (max-width: 420px) {
  #hud { padding: 12px 12px 28px; }
  .nav { top: 12px; right: 10px; flex-direction: column; align-items: flex-end; gap: 4px; }
  .nav a { font-size: 9px; }
  .brief { bottom: 145px; width: 57vw; }
  .brief p { display: none; }
  #tools { right: 10px; bottom: 139px; max-width: 42vw; }
  #vr-hint { font-size: 8px; }
  #stat { bottom: 98px; }
  #ctrl { width: calc(100vw - 14px); }
  #ctrl button { font-size: 9px; letter-spacing: 0; }
  #cap { bottom: 148px; width: calc(100vw - 20px); max-height: 32vh; padding: 11px 12px 9px; }
  body.factory-active #cap { top: 82px; right: 10px; bottom: auto; left: 10px; width: auto; max-height: 30vh; }
  #cap h2 { font-size: 15px; }
  #cap p { font-size: 11px; line-height: 1.65; }
  #cap .s { font-size: 9px; }
  #cap-progress { gap: 4px; margin-top: 8px; }
  #cap-nav { margin-top: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

<header id="hud">
  <div class="identity">
    <div class="seal" aria-hidden="true"><span>火</span></div>
    <div>
      <div class="eyebrow">东北抗联史迹 · 1931—1945</div>
      <h1>密营 · 燎原</h1>
    <div class="subtitle"><span id="m-events">66</span> 条记载 · <span id="m-sources">33</span> 家来源机构 · <span id="m-sites">34</span> 处有坐标遗址</div>
    </div>
  </div>
  <nav class="nav" aria-label="作品视图">
    <a href="index.html">证据结构</a>
    <a href="dossier.html">灯下卷宗</a>
  </nav>
</header>
<div id="tools">
  <button class="vr-button" id="b-vr" type="button" disabled aria-describedby="vr-hint">检测沉浸式 VR…</button>
  <div id="vr-hint" role="status" aria-live="polite">WebXR 头显接入检测中</div>
  <button class="gyro-button" id="b-gyro" type="button" aria-describedby="vr-hint">开启手机环视</button>
</div>
<section class="brief" aria-label="场景说明">
  <div class="tag">抗战记忆 · 针线与守望</div>
  <h2>针线里有山河，<br>守望中见信念。</h2>
  <p>沿史料时间线进入 1936 年第三军被服厂密营。人物、陈设和院落为合成视觉示意，史实日期与行动可回查来源。</p>
</section>
<div id="stat" role="status" aria-live="polite">正在构建雪原与证据网络</div>
<div id="ctrl" role="toolbar" aria-label="场景演示控制">
  <button class="primary" id="b-tour" type="button" title="播放八幕东北抗联史料故事线">剧情漫游</button>
  <button id="b-storm" type="button" title="移除当前最大支撑来源">风雪试验</button>
  <button id="b-chengbin" type="button" title="聚焦相关记载；该视角不加入未验证的因果边">人物脉络</button>
  <button id="b-embers" type="button" title="以 1941 年为叙事分界的展示模式">十四年 · 余烬</button>
  <button id="b-factory" type="button" title="进入第三军被服厂密营合成场景">针线与守望</button>
  <button id="b-reset" type="button" title="恢复完整场景">复原</button>
</div>
<div id="tip" role="tooltip" aria-live="polite"></div>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="p-h" aria-describedby="p-lines" tabindex="-1">
  <div class="card">
    <div class="h" id="p-h"></div>
    <div class="big" id="p-big"></div>
    <div class="lines" id="p-lines"></div>
    <button id="p-close" type="button">复原 · 让火重新亮起来</button>
  </div>
</div>
<section id="cap" aria-label="剧情与场景说明">
  <div id="cap-narration" role="status" aria-live="polite" aria-atomic="true">
    <div id="cap-step"></div>
    <h2 id="cap-title"></h2>
    <p id="cap-copy"></p>
    <small id="cap-source" class="s"></small>
  </div>
  <div id="cap-progress" role="group" aria-label="剧情分幕">
    <button type="button" aria-label="跳到第一幕" title="第一幕"></button>
    <button type="button" aria-label="跳到第二幕" title="第二幕"></button>
    <button type="button" aria-label="跳到第三幕" title="第三幕"></button>
    <button type="button" aria-label="跳到第四幕" title="第四幕"></button>
    <button type="button" aria-label="跳到第五幕" title="第五幕"></button>
    <button type="button" aria-label="跳到第六幕" title="第六幕"></button>
    <button type="button" aria-label="跳到第七幕" title="第七幕"></button>
    <button type="button" aria-label="跳到第八幕" title="第八幕"></button>
  </div>
  <div id="cap-nav" hidden>
    <button id="b-story-prev" type="button" aria-label="上一幕">上一幕</button>
    <span id="cap-clock">0:00 / 1:20</span>
    <button id="b-story-next" type="button" aria-label="下一幕">下一幕</button>
  </div>
</section>
<div id="loading" role="status" aria-live="polite"><div class="mark" aria-hidden="true"></div><div class="t">密 营 · 燎 原</div><div class="s">正在构建史料与场景……</div></div>
